name: Python

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check generator

      - name: Ruff format check
        run: uv run ruff format --check generator

      - name: Mypy
        run: uv run mypy generator

      - name: Pytest
        run: uv run pytest generator/tests -v --cov --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          # terraform_fmt/terraform_validate need Terraform installed, and
          # the terraform workflow already covers both, with real backend
          # access this job doesn't have. No point installing it twice for
          # a shallower check.
          SKIP: terraform_fmt,terraform_validate
