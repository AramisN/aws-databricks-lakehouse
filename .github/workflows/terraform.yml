name: Terraform

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/foundation
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.x
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive || {
            echo "::error::Terraform files are not formatted. Run 'terraform fmt' locally and commit the result."
            exit 1
          }

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: false
          config_file: .checkov.yaml
          baseline: .checkov.baseline

      - name: Terraform plan
        run: |
          set +e
          {
            echo "### Terraform Plan"
            echo '```'
            terraform plan -no-color -var "kms_key_arn=${{ vars.KMS_KEY_ARN }}"
            plan_exit=$?
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$plan_exit"
