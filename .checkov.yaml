# Skips here are check-ID-wide (skip-check has no per-resource targeting),
# but each one below only ever matches a single resource in this repo, so
# in practice it's equivalent to a scoped skip.
#
# Inline #checkov:skip comments are kept in the .tf files as documentation,
# but are confirmed NOT honored by checkov for any of these checks -
# verified locally across checkov 2.5.0 through 3.3.16 in an isolated
# test file. Not a version-pinnable regression; these are graph-based
# checks that have never supported inline suppression comments.
skip-check:
  # Single region by design, see ADR-0003. Applies to every bucket.
  - CKV_AWS_144
  # No event consumer exists yet, for any bucket.
  - CKV2_AWS_62
  # Bootstrap KMS key root statement (aws_iam_policy_document.tfstate_kms,
  # the EnableRootFullAccess statement): the AWS-recommended anti-lockout
  # policy. Broad root access is intended, not an oversight. Only one such
  # statement exists in this repo.
  - CKV_AWS_109
  - CKV_AWS_111
  - CKV_AWS_356
  # VPC flow logs CloudWatch log group (module.network.aws_cloudwatch_log_group.flow_logs):
  # dev logs kept 14 days on purpose for cost, one-year retention not needed.
  - CKV_AWS_338
