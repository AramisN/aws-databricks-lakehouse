[project]
name = "aws-databricks-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.91",
    "faker>=40.38.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]


[project.scripts]
rides-generate = "generator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]